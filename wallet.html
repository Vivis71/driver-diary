<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Кошелёк</title>
<style>
:root{--bg:#161a28;--card:#262b3d;--line:#343a52;--txt:#e9ecf4;--mut:#a3acc2;--acc:#f5a524;--green:#3fbf8a;--red:#f0707a;--btn:#2f3550;--bline:#454d6b;--bar:#4f5a85}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;padding:12px;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cap{color:var(--mut);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.mut{color:var(--mut);font-size:12px}
.title{font-size:17px;font-weight:600}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--bline);color:var(--txt);text-decoration:none;font-size:20px;display:flex;align-items:center;justify-content:center;background:var(--btn);flex-shrink:0}
.mg{display:grid;align-items:center;gap:8px}
.mhead{color:var(--mut);font-size:11px;font-weight:600;padding:0 4px 4px}
.mrow{padding:4px;border-radius:8px;cursor:pointer}
.mrow .ml{font-size:12px;color:var(--mut)}
.mrow .mc{display:block;min-width:0}
.mrow .mc b{display:block;font-size:12px;font-weight:500;text-align:right;white-space:nowrap;color:var(--mut);font-variant-numeric:tabular-nums}
.mrow .trk{display:block;height:4px;border-radius:2px;background:#1c2030;margin-top:3px;overflow:hidden}
.mrow .trk i{display:block;height:100%;border-radius:2px}
.mrow.on{background:rgba(245,165,36,.1)}
.mrow.on .ml{color:var(--txt);font-weight:600}
.mrow.on .mc b{color:var(--txt);font-weight:600}
.more{width:100%;margin-top:6px;background:transparent;border:0;color:var(--mut);font-size:12px;font-family:inherit;padding:6px;cursor:pointer}
.crow{display:grid;gap:8px;align-items:center;padding:6px 4px;font-size:13px;border-top:1px solid var(--line)}
.crow.first{border-top:0}
.crow .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cv{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.crow .cv.has{color:var(--txt)}
.crow.total{font-weight:600}
.crow.total .cv{color:var(--txt);font-weight:600}
.btn{flex:1;border-radius:12px;padding:12px 4px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:1.5px solid}
.btn.main{background:var(--acc);border-color:var(--acc);color:#2a1c00}
.btn.out{background:transparent;border-color:var(--acc);color:var(--acc)}
.btn.plain{background:transparent;border-color:var(--bline);color:var(--txt)}
.smallbtn{border:1px solid var(--bline);background:var(--btn);color:var(--txt);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0 0;margin-top:8px;font-size:13px}
.vrow:first-child{border-top:0;margin-top:0;padding-top:0}
.amt{font-weight:600;text-align:right}
.x{width:30px;height:30px;border-radius:8px;border:1px solid var(--bline);background:transparent;color:var(--red);font-size:14px;cursor:pointer;padding:0;flex-shrink:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.ov.show{display:flex}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:94vh;overflow-y:auto}
.dlg h3{margin:0 0 8px;font-size:16px;font-weight:600}
.btns{display:flex;gap:8px;margin-top:12px}
.dlg.compact{padding:10px}
.dlg.compact .btns{gap:6px;margin-top:8px}
.dlg.compact .btn{padding:7px 4px;font-size:13px;border-radius:10px}
.top{display:flex;gap:6px}
.dd{flex:1;min-width:0;background:#1c2030;border:1px solid var(--bline);border-radius:9px;padding:0 10px;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:500;height:36px;font-variant-numeric:tabular-nums}
.dd .l{font-size:11px;color:var(--mut);font-weight:400}
.dd small{font-size:13px;color:var(--mut);margin-left:6px;font-weight:400}
.dd .ph{color:#4a5272}
.dt{position:relative;display:flex;align-items:center;gap:5px;background:#1c2030;border:1px solid var(--bline);border-radius:9px;padding:0 9px;height:36px;white-space:nowrap;cursor:pointer}
.dt input{background:transparent;border:0;color:var(--txt);font-size:12px;font-family:inherit;color-scheme:dark;width:86px;padding:0}
.dt input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.pad button{background:var(--btn);border:1px solid var(--bline);border-radius:8px;color:var(--txt);font-size:15px;font-weight:500;height:28px;padding:0;font-family:inherit;cursor:pointer}
.pad button:active{background:#3a4262}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:6px}
.it{display:flex;align-items:center;gap:5px;background:#1c2030;border:1px solid var(--line);border-radius:7px;padding:0 6px;height:26px;font-size:12px;min-width:0;white-space:nowrap;cursor:pointer;color:var(--txt)}
.bx{width:13px;height:13px;border-radius:4px;border:1.5px solid #6a7396;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cur .it.on{border-color:var(--acc);background:rgba(245,165,36,.1)}
.cur .it.on .bx{background:var(--acc);border-color:var(--acc);color:#2a1c00}
.cat .it.on{border-color:var(--green);background:rgba(63,191,138,.1)}
.cat .it.on .bx{background:var(--green);border-color:var(--green);color:#0b2a1c}
.empty{text-align:center;padding:18px 10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92%;background:var(--btn);color:var(--txt);border:1px solid var(--bline);padding:10px 16px;border-radius:12px;font-size:13px;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">

  <div class="card row" style="justify-content:flex-start;gap:12px">
    <a class="back" href="index.html" aria-label="Назад">←</a><span class="title">Кошелёк</span>
  </div>

  <div id="noProfile" class="card empty hidden">
    <div class="title">Профиль не найден</div>
    <div class="mut" style="margin-top:6px">Вернитесь на главную и выберите профиль</div>
  </div>

  <div id="main">
    <button class="btn main" id="bAdd" style="width:100%;flex:none;margin-bottom:8px">+ Добавить чек</button>

    <div class="card">
      <div class="cap" style="margin-bottom:6px">Расходы по месяцам</div>
      <div id="chart"></div>
      <button class="more hidden" id="bMore"></button>
    </div>

    <div class="card">
      <div class="cap" style="margin-bottom:6px" id="catCap">По категориям</div>
      <div id="catList"></div>
    </div>

    <div class="card row">
      <span>Чеки месяца <span class="mut" id="rCnt"></span></span>
      <button class="smallbtn" id="bList">Список ›</button>
    </div>
  </div>
</div>

<div class="ov" id="ov"><div class="dlg"><h3 id="dTitle"></h3><div id="dBody"></div><div class="btns" id="dBtns"></div></div></div>
<div id="toast"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
/* Три валюты. Чтобы заменить, достаточно поправить этот список; первая в списке — по умолчанию */
/* c — код в данных, s — знак в суммах, l — подпись, k — цвет в статистике */
var CURS = [{c:'EUR', s:'€', l:'EUR', k:'#f5a524'}, {c:'PLN', s:'zł', l:'zł', k:'#8b7cf6'}, {c:'BYN', s:'Br', l:'BYN', k:'#4aa3df'}];
var CATS = ['Прочее','Продукты','Одежда','Связь','Здоровье','Логистика','Бытовая химия'];
var OLD_CATS = {'Интернет':'Связь','Мобильная связь':'Связь'};   // старые категории -> новая
var MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MSHORT = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
var CHECK = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>';
var CAL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3acc2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/></svg>';

function pad(n){ return String(n).padStart(2,'0'); }
function todayIso(){ var t = new Date(); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
function fmtDay(s){ var p = s.split('-'); return p[2]+'.'+p[1]; }
function sym(c){ for (var i = 0; i < CURS.length; i++) if (CURS[i].c === c) return CURS[i].s; return c; }
function curLab(c){ for (var i = 0; i < CURS.length; i++) if (CURS[i].c === c) return CURS[i].l; return c; }
function money(cents){ return (cents/100).toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function mIndex(key){ var p = key.split('-'); return parseInt(p[0],10)*12 + parseInt(p[1],10) - 1; }
function mKey(i){ return Math.floor(i/12) + '-' + pad(i%12 + 1); }

function toast(t, ms){
  var e = $('toast'); e.textContent = t; e.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(function(){ e.style.opacity = 0; }, ms || 3000);
}

/* ---------- хранилище: чеки лежат внутри профиля (prof.wallet.receipts) ---------- */
var profiles = [], idx = 0, prof = null, W = null;
function load(){
  try { profiles = JSON.parse(localStorage.getItem('driver_profiles')) || []; } catch(e){ profiles = []; }
  var i = parseInt(localStorage.getItem('active_profile_index'), 10);
  idx = (i >= 0 && profiles[i]) ? i : 0;
  prof = profiles[idx] || null;
  if (!prof) return false;
  if (!prof.wallet || typeof prof.wallet !== 'object') prof.wallet = {};
  if (!Array.isArray(prof.wallet.receipts)) prof.wallet.receipts = [];
  W = prof.wallet;
  var moved = false;
  W.receipts.forEach(function(r){ if (OLD_CATS[r.k]){ r.k = OLD_CATS[r.k]; moved = true; } });
  if (moved) save();
  return true;
}
function save(){
  profiles[idx] = prof;
  try { localStorage.setItem('driver_profiles', JSON.stringify(profiles)); } catch(e){ toast('⚠️ Не удалось сохранить'); }
}

/* ---------- выбранный месяц и валюта диаграммы ---------- */
var now0 = new Date();
var curKey = now0.getFullYear() + '-' + pad(now0.getMonth() + 1);
var selKey = curKey;
function monthReceipts(key){
  return W.receipts.filter(function(r){ return r.d.slice(0,7) === key; })
    .sort(function(a,b){ return a.d < b.d ? 1 : a.d > b.d ? -1 : b.id - a.id; });
}

/* ---------- диалоги ---------- */
function openDlg(title, bodyHtml, buttons, cls){
  $('dTitle').textContent = title;
  $('dTitle').style.display = title ? '' : 'none';
  $('ov').firstElementChild.className = 'dlg' + (cls ? ' ' + cls : '');
  $('dBody').innerHTML = bodyHtml;
  var bb = $('dBtns'); bb.innerHTML = '';
  buttons.forEach(function(b){
    var el = document.createElement('button');
    el.className = 'btn ' + (b.cls || 'plain'); el.textContent = b.text;
    el.onclick = function(){ var r = b.fn ? b.fn() : null; if (r !== false) closeDlg(); };
    bb.appendChild(el);
  });
  $('ov').classList.add('show');
}
function closeDlg(){ $('ov').classList.remove('show'); }
function askConfirm(text, fn){ openDlg(text, '', [{text:'Да', cls:'out', fn:fn}, {text:'Нет'}]); }

/* ---------- квадратики с галочкой: выбран ровно один вариант ---------- */
function mkChecks(host, items, val, onPick){
  function draw(){
    host.innerHTML = '';
    items.forEach(function(it){
      var on = it.v === val, d = document.createElement('div');
      d.className = 'it' + (on ? ' on' : '');
      d.innerHTML = '<span class="bx">' + (on ? CHECK : '') + '</span>' + esc(it.t);
      if (it.wide) d.style.gridColumn = 'span 2';
      d.onclick = function(){ if (val === it.v) return; val = it.v; draw(); onPick(it.v); };
      host.appendChild(d);
    });
  }
  draw();
}

/* ---------- добавить чек: сумма и дата сверху, потом валюта и категория ---------- */
function openAdd(){
  var amt = '', cur = CURS[0].c, cat = CATS[0];
  var html = '<div class="top"><div class="dd" id="dd"></div>'
    + '<label class="dt">' + CAL + '<input type="date" id="fd" value="' + todayIso() + '"></label></div>'
    + '<div class="pad" id="pad"></div>'
    + '<div class="g3 cur" id="curBox" style="margin-top:8px"></div><div class="g3 cat" id="catBox"></div>';
  openDlg('', html, [{text:'Добавить', cls:'main', fn:function(){
    var cents = Math.round(parseFloat(amt || '0') * 100);
    if (!(cents > 0)){ toast('Введите сумму'); return false; }
    var d = $('fd').value || todayIso();
    W.receipts.push({id: Date.now(), d: d, a: cents, c: cur, k: cat});
    save();
    selKey = d.slice(0,7);
    render();
    toast('✅ Добавлено: ' + money(cents) + ' ' + sym(cur) + ' · ' + cat);
  }}, {text:'Отмена'}], 'compact');

  function upd(){
    $('dd').innerHTML = '<span class="l">Сумма</span><span>' + (amt ? esc(amt) : '<span class="ph">0</span>') + '<small>' + esc(curLab(cur)) + '</small></span>';
  }
  ['1','2','3','⌫','4','5','6','.','7','8','9','0'].forEach(function(k){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = k;
    b.onclick = function(){
      if (k === '⌫') amt = amt.slice(0, -1);
      else if (k === '.'){ if (amt.indexOf('.') < 0) amt = (amt || '0') + '.'; }
      else {
        var dot = amt.indexOf('.');
        if (dot >= 0 && amt.length - dot > 2) return;
        if (dot < 0 && amt.length >= 7) return;
        amt = (amt === '0') ? k : amt + k;
      }
      upd();
    };
    $('pad').appendChild(b);
  });
  mkChecks($('curBox'), CURS.map(function(x){ return {v:x.c, t:x.l}; }), cur, function(v){ cur = v; upd(); });
  mkChecks($('catBox'), CATS.map(function(k){ return {v:k, t:k, wide:k === 'Бытовая химия'}; }), cat, function(v){ cat = v; });
  upd();
}

/* ---------- список чеков месяца ---------- */
function openList(){
  var list = monthReceipts(selKey);
  if (!list.length){ toast('В этом месяце чеков нет'); return; }
  openDlg('Чеки · ' + MONTHS[parseInt(selKey.slice(5),10) - 1] + ' ' + selKey.slice(0,4), '<div id="rBox" style="max-height:55vh;overflow-y:auto"></div>', [{text:'Закрыть', cls:'plain'}]);
  var box = $('rBox');
  list.forEach(function(r){
    var row = document.createElement('div'); row.className = 'vrow';
    row.innerHTML = '<span><span class="mut">' + fmtDay(r.d) + '</span> ' + esc(r.k) + '</span>' +
      '<span style="display:flex;align-items:center;gap:8px"><span class="amt">' + money(r.a) + ' ' + sym(r.c) + '</span>' +
      '<button class="x" aria-label="Удалить">✕</button></span>';
    row.querySelector('.x').onclick = function(){
      askConfirm('Удалить чек?', function(){
        W.receipts = W.receipts.filter(function(x){ return x.id !== r.id; });
        save(); render();
        if (monthReceipts(selKey).length) setTimeout(openList, 0);
      });
    };
    box.appendChild(row);
  });
}

/* ---------- отрисовка ---------- */
var showAll = false;
function render(){
  // колонки: только валюты, в которых есть чеки (первая, EUR, есть всегда)
  var used = {}; used[CURS[0].c] = 1;
  W.receipts.forEach(function(r){ used[r.c] = 1; });
  var cols = CURS.filter(function(x){ return used[x.c]; });
  var cells = cols.map(function(){ return 'minmax(0,1fr)'; }).join(' ');
  var tmplM = '46px ' + cells, tmplC = 'minmax(0,1.5fr) ' + cells;

  // суммы по месяцам и валютам
  var byM = {}, sel = mIndex(selKey);
  W.receipts.forEach(function(r){
    var k = r.d.slice(0,7), o = byM[k] || (byM[k] = {}); o[r.c] = (o[r.c] || 0) + r.a;
  });
  // показываем только месяцы с чеками, плюс текущий и выбранный
  var set = {}; set[mIndex(curKey)] = 1; set[sel] = 1;
  Object.keys(byM).forEach(function(k){ set[mIndex(k)] = 1; });
  var all = Object.keys(set).map(Number).sort(function(a, b){ return b - a; });
  var shown = all.slice(0, showAll ? 24 : 6);
  if (shown.indexOf(sel) < 0) shown.push(sel);                  // выбранный месяц виден всегда
  shown.sort(function(a, b){ return b - a; });
  var max = {}, i;
  cols.forEach(function(x){ max[x.c] = 0; });
  shown.forEach(function(n){ var o1 = byM[mKey(n)] || {}; cols.forEach(function(x){ max[x.c] = Math.max(max[x.c], o1[x.c] || 0); }); });
  var ch = '<div class="mg mhead" style="grid-template-columns:' + tmplM + '"><span></span>' +
    cols.map(function(x){ return '<span style="color:' + x.k + ';text-align:right">' + esc(x.l) + '</span>'; }).join('') + '</div>';
  shown.forEach(function(n){
    var k = mKey(n), o2 = byM[k] || {}, y = k.slice(0,4), m = parseInt(k.slice(5),10) - 1;
    var mlab = MSHORT[m] + (y !== curKey.slice(0,4) ? "'" + y.slice(2) : '');
    ch += '<div class="mg mrow' + (k === selKey ? ' on' : '') + '" data-k="' + k + '" style="grid-template-columns:' + tmplM + '"><span class="ml">' + mlab + '</span>' +
      cols.map(function(x){
        var v = o2[x.c] || 0;
        return '<span class="mc"><b>' + (v ? money(v) : '—') + '</b><span class="trk"><i style="width:' + (max[x.c] ? Math.max(v ? 3 : 0, v / max[x.c] * 100) : 0) + '%;background:' + x.k + '"></i></span></span>';
      }).join('') + '</div>';
  });
  $('chart').innerHTML = ch;
  [].forEach.call($('chart').querySelectorAll('.mrow'), function(r){
    r.onclick = function(){ selKey = r.getAttribute('data-k'); render(); };
  });
  var more = $('bMore');
  more.classList.toggle('hidden', all.length <= 6);
  more.textContent = showAll ? 'Свернуть' : 'Показать все месяцы (' + all.length + ')';
  more.onclick = function(){ showAll = !showAll; render(); };

  // выбранный месяц: категории сразу во всех валютах и строка «Всего»
  var list = monthReceipts(selKey), sm = parseInt(selKey.slice(5),10) - 1;
  $('catCap').textContent = 'По категориям · ' + MONTHS[sm] + ' ' + selKey.slice(0,4);
  var by = {}, tot = {};
  list.forEach(function(r){
    var o = by[r.k] || (by[r.k] = {}); o[r.c] = (o[r.c] || 0) + r.a;
    tot[r.c] = (tot[r.c] || 0) + r.a;
  });
  // порядок: сначала категории с наибольшей долей трат (по всем валютам)
  function score(k){ return cols.reduce(function(a, x){ return a + (tot[x.c] ? (by[k][x.c] || 0) / tot[x.c] : 0); }, 0); }
  var keys = Object.keys(by).sort(function(a,b){ return score(b) - score(a); });
  if (!keys.length){
    $('catList').innerHTML = '<div class="mut" style="text-align:center;padding:6px 0">В этом месяце трат нет</div>';
  } else {
    var cl = '<div class="mg mhead" style="grid-template-columns:' + tmplC + '"><span></span>' +
      cols.map(function(x){ return '<span style="color:' + x.k + ';text-align:right">' + esc(x.l) + '</span>'; }).join('') + '</div>';
    keys.forEach(function(k, n){
      cl += '<div class="crow' + (n === 0 ? ' first' : '') + '" style="grid-template-columns:' + tmplC + '"><span class="cn">' + esc(k) + '</span>' +
        cols.map(function(x){ var v = by[k][x.c] || 0; return '<span class="cv' + (v ? ' has' : '') + '">' + (v ? money(v) : '—') + '</span>'; }).join('') + '</div>';
    });
    cl += '<div class="crow total" style="grid-template-columns:' + tmplC + '"><span class="cn">Всего</span>' +
      cols.map(function(x){ return '<span class="cv">' + (tot[x.c] ? money(tot[x.c]) : '—') + '</span>'; }).join('') + '</div>';
    $('catList').innerHTML = cl;
  }

  $('rCnt').textContent = '· ' + list.length;
}

/* ---------- запуск ---------- */
(function(){
  if (!load()){ $('main').classList.add('hidden'); $('noProfile').classList.remove('hidden'); return; }
  $('bAdd').onclick = openAdd;
  $('bList').onclick = openList;
  $('ov').onclick = function(e){ if (e.target === $('ov')) closeDlg(); };
  render();
})();
</script>
<script>
/* «←» в разделе = то же, что кнопка «Назад» телефона: возврат на главную без лишних записей в истории */
document.querySelectorAll('a.back').forEach(function(a){
  a.addEventListener('click', function(e){
    e.preventDefault();
    var ok = false; try { ok = sessionStorage.getItem('navFromIndex') === '1'; } catch(x){}
    if (ok && history.length > 1) history.back(); else location.replace('index.html');
  });
});
</script>
</body>
</html>
